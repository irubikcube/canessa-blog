<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} — Canessa</title>
    <meta name="description"
        content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}Espacio personal de proyectos, familia e ideas desde Iquique. Blog, galería y tienda CC Beauty.{% endif %}" />
    <meta name="author" content="Cristian Canessa" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://canessa.blog{{ page.url }}" />
    <meta property="og:title" content="{{ page.title }} — Canessa" />

        content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}Espacio personal de proyectos, familia e ideas desde Iquique.{% endif %}" />
    <meta property="og:image" content="https://canessa.blog/assets/profile.jpg" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Canessa" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

        rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BQTS6WQ8WS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-BQTS6WQ8WS');
    </script>

</head>

<body class="{{ page.layout }}">
    {% include nav.html %}
    {{ content }}
    {% include footer.html %}
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>

</html>
