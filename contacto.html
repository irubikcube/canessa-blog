    .hb-section {

    .hb-eyebrow {

    .hb-title {

      margin-bottom: 0.6rem;

    .hb-form-group { margin-bottom: 1.25rem; }

    .hb-label {

    .hb-input {

      border-radius: 0;
      padding: 8px 0;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #eceae4;
      transition: border-color 0.2s;

    .hb-input::placeholder {
      color: #555550;
      font-weight: 300;
    }

    textarea.hb-input {
      resize: none;
      height: 80px;
      padding-top: 8px;
    }

    .hb-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1.5rem;
      padding: 9px 20px;

      border: 1px solid rgba(236, 234, 228, 0.35);

      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #eceae4;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;

    .hb-btn:hover {
      background: rgba(236, 234, 228, 0.08);
      border-color: rgba(236, 234, 228, 0.6);
    }

    .hb-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hb-right { padding-top: 0.5rem; }

    .hb-map-wrap {

      height: 160px;
      border-radius: 4px;
      overflow: hidden;
      border: 0.5px solid #3a3a36;
      margin-bottom: 1.5rem;

    .hb-map-wrap iframe {

      height: 100%;

    .hb-location {

      color: #777770;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2rem;
      font-weight: 300;

    .hb-location svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;

    .hb-divider {
      height: 0.5px;
      background: #3a3a36;
      margin: 2rem 0;
    }

    .hb-social-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666660;
      margin-bottom: 0.75rem;
    }

    .hb-social {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .hb-social a {
      color: #666660;
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }

    .hb-social a:hover { color: #eceae4; }

    .hb-social svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;

    }

    .hb-vcf svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;

<section class="hb-section">

  <p class="hb-eyebrow">Contacto</p>
  <h1 class="hb-title">Hablemos</h1>

          <input class="hb-input" id="correo" name="email" type="email" placeholder="tu@email.com" required />
        </div>

        <div class="hb-form-group">
          <label class="hb-label" for="mensaje">Mensaje</label>
          <textarea class="hb-input" id="mensaje" name="mensaje" placeholder="Escríbeme…" required></textarea>
        </div>

        <button class="hb-btn" type="submit">

          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
